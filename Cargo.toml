[workspace]
resolver = "3"
members = [
    # "crates/core",
    # "crates/indexer",
    # "crates/network",
    # "crates/plugins",
    "crates/kaze-core",
    "crates/app",
    # "crates/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["arelive <me@are.moe>"]
license = "MIT"
description = ""
readme = "README.md"
repository = "https://github.com/arebaka/kaze"
homepage = "https://github.com/arebaka/kaze"
documentation = "https://github.com/arebaka/kaze"
categories = []
keywords = []
publish = false

[workspace.dependencies]
# Async
tokio = { version = "1.52.1", features = ["sync"] }
# tokio-util   = { version = "0.7",   features = ["compat"] }
# futures      = "0.3"
# async-trait  = "0.1"
# Serialisation
# serde        = { version = "1.0.195", features = ["derive", "rc"] }
# serde_json   = "1.0.111"
# toml         = "0.8.8"
# rmp-serde    = "1.3"
# Error handling
# thiserror    = "1.0.56"
# anyhow       = "1.0.79"
# Filesystem
# notify       = { version = "6.1",  features = ["serde"] }
# walkdir      = "2.4"
# mime_guess   = "2.0"
# xattr        = "1.3"
# Database
# sqlx         = { version = "0.7.3", features = ["sqlite", "runtime-tokio", "chrono"] }
# Logging
# tracing      = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Utils
# uuid         = { version = "1.6",  features = ["v4", "serde"] }
chrono       = { version = "0.4.31", features = ["serde"] }
icu_collator = "~2.3"
icu_locale_core = "~2.3"
# dashmap      = "5.5"
# arc-swap     = "1.7"
# parking_lot  = "0.12"
# bytes        = "1.5"
# mime         = "0.3"
# dirs         = "5.0"
# shellexpand  = "3.1"
# bitflags     = { version = "2.4", features = ["serde"] }
# indexmap     = "=2.14.0"
# hostname     = "0.3"
slint = { version = "1.16.1", features = ["live-preview", "log", "serde", "image-default-formats", "renderer-skia", "unstable-winit-030"] }
i-slint-backend-testing = "1.18.1"
i-slint-core = { version = "1.18.1", default-features = false }
users = "0.11.0"
walkdir = "2.5.0"
# Plugin runtime (large compile — defer)
# wasmtime   = { version = "20", default-features = false, features = ["cranelift", "async"] }
# Network (defer)
# quinn      = "0.11"
# rustls     = { version = "0.23", features = ["ring"] }
# mdns-sd    = "0.11"

[profile.dev]
opt-level = 0
debug = "full"
strip = "none"
debug-assertions = true
overflow-checks = true
lto = "off"
panic = "abort"
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = "s"
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.bench]
inherits = "release"
